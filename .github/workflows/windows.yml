# Builds FastShot for Windows (windows/) and publishes FastShot-Setup-x64.exe
# (the app, which installs itself; installed copies update from these releases)
# as a GitHub release whenever a windows-v* tag is pushed:
#
#   git tag -a windows-v1.1.0 -m "Release notes, shown on the release page"
#   git push origin windows-v1.1.0
#
# The tag's message becomes the release notes, and the version in the tag
# goes into the exe. A tag whose release already exists gets its exe replaced.
#
# Without pushing a tag: Actions > Windows > "Run workflow" on main with
# "Yayınla" ticked publishes windows-v<Version from windows/Directory.Build.props>,
# with windows/release-notes.md as its notes (a version that is already out is
# refused: raise the version first).
#
# "Run workflow" (build only) builds and starts the exe without publishing.
# After publishing, older Windows releases are deleted (their tags stay).
# The macOS app is not touched.

name: Windows

on:
  push:
    tags: ['windows-v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_only:
        description: Sadece derle, yayınlama (deneme)
        type: boolean
        default: true
      publish:
        description: "Yayınla (yalnızca main; Sadece derle'yi geçersiz kılar): Directory.Build.props'taki sürümü windows/release-notes.md notlarıyla yayınlar"
        type: boolean
        default: false

concurrency:
  group: windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'windows-v')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run Windows regression tests
        run: dotnet test windows/FastShot.slnx -c Release --logger "trx;LogFileName=windows-tests.trx"

      - name: Version from the tag
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_ONLY: ${{ inputs.build_only }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # A windows-v* tag (pushed, or its release published) is published unless the run is build-only.
          # "Run workflow" on main with "publish" publishes the version in Directory.Build.props.
          $version = '0.0.0'; $tag = ''; $publish = $false; $fromTag = $false
          if ($env:REF -like 'refs/tags/*' -and $env:REF_NAME -match '^windows-v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]; $tag = $env:REF_NAME; $publish = $env:BUILD_ONLY -ne 'true'; $fromTag = $true
          } elseif ($env:PUBLISH -eq 'true') {
            if ($env:REF -ne 'refs/heads/main') { throw "Yalnızca main yayınlanır (bu: $env:REF_NAME)." }
            $version = ([xml](Get-Content windows/Directory.Build.props)).Project.PropertyGroup.Version
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Directory.Build.props'taki sürüm okunamadı: $version" }
            $tag = "windows-v$version"; $publish = $true
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "from_tag=$($fromTag.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "FastShot for Windows $version" + $(if ($publish) { " → $tag yayınlanacak" } else { '' }) >> $env:GITHUB_STEP_SUMMARY

      - name: Build FastShot-Setup-x64.exe
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          # Self-contained, so it runs on PCs without .NET installed.
          dotnet publish windows/src/FastShot/FastShot.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:Version=${{ steps.version.outputs.version }} -o out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item out/FastShot.exe out/FastShot-Setup-x64.exe
          "exe: {0:N1} MB" -f ((Get-Item out/FastShot-Setup-x64.exe).Length / 1MB) >> $env:GITHUB_STEP_SUMMARY

      - name: Check that it starts
        run: |
          # --embedded runs it without a tray icon; it reports its state on stdout and quits when stdin closes.
          $start = New-Object System.Diagnostics.ProcessStartInfo (Resolve-Path out/FastShot-Setup-x64.exe)
          $start.Arguments = "--embedded $PID"
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $process = [System.Diagnostics.Process]::Start($start)
          $line = $process.StandardOutput.ReadLineAsync()
          if (-not $line.Wait(60000) -or $line.Result -notmatch '"type":"state"') { throw "FastShot did not start: $($line.Result)" }
          $process.StandardInput.Close()
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'FastShot did not quit' }
          "Started and quit: $($line.Result)" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish ${{ steps.version.outputs.tag }}
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          FROM_TAG: ${{ steps.version.outputs.from_tag }}
        run: |
          $tag = $env:TAG
          gh release view $tag > $null 2>&1
          $exists = $LASTEXITCODE -eq 0
          if ($env:FROM_TAG -eq 'true') {
            if ($exists) { gh release upload $tag out/FastShot-Setup-x64.exe --clobber }
            else { gh release create $tag out/FastShot-Setup-x64.exe --title "FastShot for Windows $env:VERSION" --notes-from-tag --verify-tag }
          } else {
            # Installed copies only take a higher version, so the same version must not be published twice.
            if ($exists) { throw "$tag zaten yayınlandı; windows/Directory.Build.props'ta sürümü yükseltin." }
            gh release create $tag out/FastShot-Setup-x64.exe --title "FastShot for Windows $env:VERSION" --notes-file windows/release-notes.md --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Published $tag" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep only this Windows release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # One Windows version: installed copies update themselves to this one, so older Windows
          # releases are deleted (their tags stay). macOS releases are not touched.
          $tag = $env:TAG
          if ($tag -notmatch '^windows-v(\d+\.\d+\.\d+)$') { exit 0 }
          $current = [version]$Matches[1]
          $tags = gh release list --limit 200 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($old in $tags) {
            if ($old -notmatch '^windows-v(\d+\.\d+\.\d+)$' -or [version]$Matches[1] -ge $current) { continue }
            gh release delete $old --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "Deleted release $old" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Keep the exe of a build-only run
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: FastShot-Setup-x64
          path: out/FastShot-Setup-x64.exe
          retention-days: 7
